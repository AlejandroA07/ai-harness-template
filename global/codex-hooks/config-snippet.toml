# APPEND-SAFE SNIPPET — but note: `hooks = true` must live in your EXISTING
# [features] table (TOML forbids duplicate tables; a second [features] makes the
# whole config fail to load — learned 2026-07-15). If ~/.codex/config.toml has no
# [features] table yet, add one with `hooks = true`; otherwise merge the key in.
# Codex enables hooks by default, so the key is explicit belt-and-braces.

# --- Harness: machine-wide publish guard (added 2026-07-15) ---
# Best-effort mechanical backstop, not a complete boundary: blocks `git commit` /
# `git push` proposed by the agent in ANY repo. Manuel commits and pushes himself.
# No matcher on purpose: the script self-filters (exits 0 when no command field),
# so it can never be silently disabled by a tool-name mismatch.
# (`hooks = true` is merged into the [features] table earlier in this file.)
[[hooks.PreToolUse]]

[[hooks.PreToolUse.hooks]]
type = "command"
command = '/bin/bash "$HOME/.codex/hooks/guard-git-publish.sh"'
timeout = 10
statusMessage = "Checking command against publish guard"
