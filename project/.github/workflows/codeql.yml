name: CodeQL

# EDIT BEFORE USE: set `languages:` below (csharp | javascript-typescript | python | go | java | ...).
# For compiled languages add the build steps CodeQL needs (see the csharp example left in place).
# Action SHAs were current 2026-07-09 — refresh with:
#   git ls-remote https://github.com/<owner>/<repo> "refs/tags/<tag>^{}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday morning

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read # required for the SARIF upload in private repositories

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # DELETE for interpreted languages (JS/TS/Python); keep+adapt for compiled ones
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          languages: csharp # <-- EDIT
          queries: security-extended

      # DELETE for interpreted languages
      - name: Build
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
