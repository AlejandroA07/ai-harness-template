# EDIT BEFORE USE: keep only the ecosystems the project actually uses.
version: 2
updates:
  - package-ecosystem: nuget # or: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /            # EDIT: one entry per Dockerfile location
    schedule:
      interval: weekly
